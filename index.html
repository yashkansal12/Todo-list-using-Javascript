<div id= "items" class= "my-4">
<h2> Your Items</h2>
<table class="table">
  <thead>
    <tr>
      <th scope="col">SNo</th>
      <th scope="col">Item Title</th>
      <th scope="col">Item Description</th>
      <th scope="col">Actions</th>
    </tr>
  </thead>
  <tbody id ="tablebody">
    <tr>
      <th scope="row">1</th>
      <td>Get some Coffee</td>
      <td>You need coffee</td>
      <td>
        <button class= "btn btn-sm btn-primary">Edit</button>
        <button class= "btn btn-sm btn-primary">Delete</button>
      </td>
  </tbody>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
      let editIndex = -1;
      function getAndupdate() {
        console.log("Updating List...");
        let tit = document.getElementById('title').value;
        let desc = document.getElementById('Description').value;
        if (tit.trim() === "" || desc.trim() === "") {
        alert("Please enter title and description");
        return;
      }
      if (localStorage.getItem('itemsJson') == null) {
        itemJsonArray = [];
      }
      else {
        itemJsonArray = JSON.parse(localStorage.getItem('itemsJson'));
      }
      
      if (editIndex !== -1) {
        itemJsonArray[editIndex] = [tit, desc];
        editIndex = -1;
        document.getElementById("add").innerText = "Add to list";
      }
      else {
        itemJsonArray.push([tit, desc]);
      }
      localStorage.setItem('itemsJson', JSON.stringify(itemJsonArray));
      document.getElementById('title').value = "";
      document.getElementById('Description').value = "";
      update();
    }

      function update(){
         if (localStorage.getItem('itemsJson')==null){
          itemJsonArray = [];
          localStorage.setItem('itemsJson', JSON.stringify(itemJsonArray))
        }
         else{
          itemJsonArrayStr = localStorage.getItem('itemsJson')
          itemJsonArray = JSON.parse(itemJsonArrayStr);         
        }

        // Populate the table
        let tablebody = document.getElementById("tablebody");
        let str = "";
        itemJsonArray.forEach((element, index) => {
          str += `
          <tr>
          <th scope="row">${index +1}</th>
          <td>${element[0]}</td>
          <td>${element[1]}</td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="edit(${index})">Edit</button>
            <button class= "btn btn-sm btn-primary" onclick="deleted(${index})">Delete</button>
            </td>
          </tr>`;
 
        });
        tablebody.innerHTML = str;
      }
      add = document.getElementById("add");
      add.addEventListener("click", getAndupdate);
      update();
      //  delete
      function deleted(itemIndex){
        console.log("Delete", itemIndex);
        itemJsonArrayStr = localStorage.getItem('itemsJson')
        itemJsonArray = JSON.parse(itemJsonArrayStr);
        // Delete itemIndex element from the array
        itemJsonArray.splice(itemIndex, 1);
        localStorage.setItem('itemsJson', JSON.stringify(itemJsonArray))
        update();
      }

      //   update();
      //   window.scrollTo(0, 0);
      // }


      function edit(itemIndex) {
        console.log("Edit", itemIndex);
        itemJsonArray = JSON.parse(localStorage.getItem('itemsJson'));
        document.getElementById('title').value = itemJsonArray[itemIndex][0];
        document.getElementById('Description').value = itemJsonArray[itemIndex][1];
        editIndex = itemIndex;
        document.getElementById("add").innerText = "Update";
        window.scrollTo(0, 0);
      }




      //  clear 
      function clearStorage(){
        if (confirm("Do you want to clear?")){
        console.log("clearing the storage")
        localStorage.clear();
        update()
        }
      }
